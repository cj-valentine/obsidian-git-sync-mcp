[project]
name = "obsidian-git-sync-mcp"
version = "0.1.0"
description = "Git-sync extension for the obsidian-web-mcp server: commits and syncs vault changes in-process, env-gated and fail-closed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Depend on the server via a commit pin on the fork, jjsmackay/obsidian-web-mcp.
    # The fork's main was re-baselined onto jimprosser/obsidian-web-mcp main
    # (2026-11-28): da6bcdb is upstream's own commit, zero fork deltas. Everything
    # the fork used to carry has landed upstream: the write-listener seam (#62),
    # the OAuth protected-resource subpath fix (#75) and the mcp<2 cap. The pin
    # stays on the fork so fork-only features can ship before they land upstream.
    # Pinned to a SHA, not a branch, so builds are reproducible and the Docker
    # layer cache re-resolves the dep on each bump. A rebase rewrites SHAs, so
    # re-pin after one.
    "obsidian-web-mcp @ git+https://github.com/jjsmackay/obsidian-web-mcp@da6bcdbaca5cbc8e3e10b0abecd5446a4aa7e685",
    # Formatting-preserving YAML round-trip for frontmatter stamping: preserves
    # users' quotes, key order, and comments, and (with a quote-strip post-process)
    # emits the Obsidian Linter's unquoted timestamp form so desktop and server
    # stamps don't thrash. PyYAML would reserialise and drop all of that.
    "ruamel.yaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
obsidian-git-sync-mcp = "obsidian_git_sync.main:main"
# Env-reading git credential helper. The name maps to the ``credential.helper``
# value ``obsidian-env`` (git prefixes ``git-credential-``); see credential_helper.py.
git-credential-obsidian-env = "obsidian_git_sync.credential_helper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The upstream dep is a direct git reference (see the pin above); hatchling
# rejects direct references in project metadata unless explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_git_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
